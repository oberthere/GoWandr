name: CI

on:
  push:
    branches: [main]
    paths: ['ai-trip-planner/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['ai-trip-planner/**', '.github/workflows/ci.yml']

# A newer push to the same branch cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-trip-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-trip-planner/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
